apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: folio
spec:
  # Replace with an installed ingress class. No controller is bundled.
  ingressClassName: internal
  tls:
    - hosts: [folio.example.internal]
      secretName: folio-tls
  rules:
    - host: folio.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: folio
                port:
                  name: http
