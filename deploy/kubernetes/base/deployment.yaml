apiVersion: apps/v1
kind: Deployment
metadata:
  name: folio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: folio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: folio
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: folio
          # Build and load this image, or replace with your registry + digest.
          image: folio:local
          imagePullPolicy: IfNotPresent
          args: [serve, --listen, "0.0.0.0:4310", --data-dir, /data/folio]
          envFrom:
            - configMapRef:
                name: folio
          env:
            - name: FOLIO_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: folio-bootstrap
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 4310
            - name: content
              containerPort: 4311
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/bootstrap
              port: http
              httpHeaders:
                - name: Host
                  value: folio.localhost:4310
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/bootstrap
              port: http
              httpHeaders:
                - name: Host
                  value: folio.localhost:4310
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/bootstrap
              port: http
              httpHeaders:
                - name: Host
                  value: folio.localhost:4310
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: folio-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
