name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: make build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/test_install.py --binary ./dist/folio
      - run: python scripts/smoke_cli.py --binary ./dist/folio
      - run: python web/tests/e2e.py --binary ./dist/folio --screenshots .work/e2e
      - run: python web/tests/google_auth.py --binary ./dist/folio --screenshots .work/google-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: .work/e2e/
