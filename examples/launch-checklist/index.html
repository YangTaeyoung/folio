<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ready to share</title><style>*{box-sizing:border-box}body{margin:0;background:#f1e6d6;color:#5d3e2a;font:15px system-ui}main{max-width:850px;padding:65px}small{letter-spacing:2px;font-size:10px;color:#a58467}h1{font:62px/1.05 Georgia,serif;letter-spacing:-2px;margin:33px 0 18px}p{font-size:13px;line-height:1.9;color:#9a775e}section{margin-top:38px;border-top:1px solid #d8c3a9}label{display:flex;gap:13px;align-items:center;padding:18px 0;border-bottom:1px solid #d8c3a9;font-size:13px;cursor:pointer}input{width:18px;height:18px;accent-color:#8e6441}label:has(input:checked){color:#ac947e;text-decoration:line-through}footer{margin-top:30px;font-size:11px;color:#a58467}progress{width:100%;height:5px;accent-color:#8e6441}output{display:block;font-size:11px;margin:15px 0}@media(max-width:600px){main{padding:30px}h1{font-size:48px}}</style><main><small>THE SMALL THINGS / LAUNCH NOTES</small><h1>Ready to<br>share something?</h1><p>작은 아이디어가 팀의 다음 작업이 되는 순간.<br>공유하기 전에 마지막으로 확인해 보세요.</p><section><label><input type="checkbox">첫 화면에서 목적이 분명하게 보이나요?</label><label><input type="checkbox">모바일에서도 읽고 사용할 수 있나요?</label><label><input type="checkbox">공유할 사람과 만료일을 확인했나요?</label><label><input type="checkbox">나중에 다시 찾을 이름을 붙였나요?</label></section><output id="count">0 of 4 complete</output><progress max="4" value="0"></progress><footer>Folio example · your checklist stays in this page</footer></main><script>document.querySelectorAll('input').forEach(el=>el.onchange=()=>{let n=document.querySelectorAll('input:checked').length;document.querySelector('progress').value=n;document.querySelector('#count').value=n+' of 4 complete'})</script></html>
