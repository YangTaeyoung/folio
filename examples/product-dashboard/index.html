<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product pulse</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#333b45;font:15px system-ui}main{padding:46px;max-width:1100px}header{display:flex;justify-content:space-between;align-items:center}small{font-size:10px;letter-spacing:2px;color:#7c8292}h1{font-size:32px;letter-spacing:-1.2px;margin:8px 0 30px}.tag{font-size:11px;color:#627a4b;background:#e8eddf;padding:7px 12px;border-radius:20px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}article{background:white;padding:24px;border:1px solid #e7e6e1;border-radius:10px}article p{font-size:11px;margin:0 0 15px;color:#9297a1}article b{font-size:34px;letter-spacing:-1px}article span{display:block;margin-top:12px;font-size:10px;color:#64925a}.chart{margin-top:22px;background:white;border:1px solid #e7e6e1;border-radius:10px;padding:25px}h2{font-size:14px;margin-top:0}.bars{height:210px;display:flex;align-items:end;gap:12px;border-bottom:1px solid #e7e6e1;padding-top:20px}.bars i{flex:1;background:#b9c5d8;border-radius:5px 5px 0 0;transition:height .3s}.bars i:last-child{background:#627a99}label{font-size:11px;color:#7c8292;display:flex;align-items:center;gap:15px;margin-top:20px}input{accent-color:#627a99}footer{margin-top:24px;font-size:10px;color:#9b9b96}@media(max-width:600px){main{padding:24px}.metrics{grid-template-columns:1fr}header{align-items:start}.tag{white-space:nowrap}.bars{height:150px}}</style><main><header><div><small>WORKSPACE / PRODUCT</small><h1>Product pulse.</h1></div><span class="tag">November report</span></header><section class="metrics"><article><p>Weekly active members</p><b id="members">128</b><span>↑ 18% from last month</span></article><article><p>Artifacts published</p><b>384</b><span>↑ 24% from last month</span></article><article><p>Team participation</p><b>86%</b><span>↑ 8 points</span></article></section><section class="chart"><h2>Every good idea starts somewhere.</h2><div class="bars" aria-label="주간 게시 추이"><i style="height:35%"></i><i style="height:46%"></i><i style="height:43%"></i><i style="height:65%"></i><i style="height:57%"></i><i style="height:80%"></i><i id="last" style="height:92%"></i></div><label>참여율 시뮬레이션<input id="growth" type="range" min="20" max="100" value="92"><output id="value">92%</output></label></section><footer>Folio example · sample data · works entirely offline</footer></main><script>document.querySelector('#growth').oninput=e=>{document.querySelector('#last').style.height=e.target.value+'%';document.querySelector('#value').value=e.target.value+'%'}</script></html>
